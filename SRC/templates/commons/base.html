<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}DocifyCode{% endblock %}</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/navbar.css" />
    <link rel="stylesheet" href="/static/css/alert.css" />
    <link rel="stylesheet" href="/static/css/confirm.css" />
    <link rel="stylesheet" href="/static/css/git_auth_dialog.css" />
    <link rel="stylesheet" href="/static/css/commit_modal.css" />
    <link rel="stylesheet" href="/static/css/conflict_modal.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Material Symbols (Outlined) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    {% block additional_css %}{% endblock %}

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/images/favicon.png" />
    <link rel="shortcut icon" type="image/png"
      href="/static/images/favicon.png" />
  </head>
  <body>
    <!-- Include Navbar -->
    {% include "commons/navbar.html" %}

    <!-- Alert Container -->
    <div id="alert-container" class="alert-container"></div>

    <!-- Git Authentication Dialogs -->
    <div id="gitPatDialog" class="git-auth-dialog" style="display:none;"></div>
    <div id="gitBucketDialog" class="git-auth-dialog" style="display:none;"></div>

    <!-- Main Content -->
    <main class="main-content">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <!-- <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 DocifyCode. All rights reserved.</p>
        </div>
    </footer> -->

    <!-- JavaScript Files -->
    <!-- SHA-256 Library (for password hashing, works on HTTP/HTTPS) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
    <script src="/static/js/commons/util.js"></script>
    <script src="/static/js/commons/alert.js"></script>
    <script src="/static/js/commons/confirm.js"></script>
    <script src="/static/js/commons/api_client.js"></script>
    <script src="/static/js/commons/navbar.js"></script>
    <script src="/static/js/commons/base.js"></script>
    <script type="module" src="/static/js/commons/git_auth_dialog.js"></script>
    <script type="module" src="/static/js/commons/git_auth_helper.js"></script>
    <script type="module" src="/static/js/commons/commit_modal.js"></script>
    <script type="module" src="/static/js/commons/conflict_modal.js"></script>
    {% block additional_js %}{% endblock %}
  </body>
</html>
